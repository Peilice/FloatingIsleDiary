<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7cc8f5">
<title>浮島日記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #cfe9ff; overflow: hidden; }
  #game { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  /* 字型放在專案裡，離線也能用（OFL 授權，見 fonts/OFL-*.txt；子集由 tools/fonts/subset.py 產生） */
  /* 中文：粉圓 Huninn；英文：Andika（識字教學字型） */
  @font-face { font-family: "Huninn"; src: url("fonts/Huninn-subset.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Andika"; src: url("fonts/Andika-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Andika"; src: url("fonts/Andika-Bold.woff2") format("woff2"); font-weight: 700; font-display: block; }
</style>
</head>
<body>
<div id="game"></div>
<script src="lib/phaser.min.js"></script>
<script src="words.js"></script>
<script src="logic.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
