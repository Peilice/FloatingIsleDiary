<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    
    <filter id="sticker" x="-12%" y="-12%" width="124%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="9" result="d"/>
      <feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="w"/>
      <feGaussianBlur in="d" stdDeviation="4" result="b"/><feOffset in="b" dy="6" result="o"/>
      <feFlood flood-color="#3b2f1e" flood-opacity=".3"/><feComposite in2="o" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#sticker)">
    <rect x="56" y="40" width="128" height="160" rx="16" fill="#2f3d63" stroke="#2b3a55" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="120" cy="92" r="26" fill="#cfd8dc" stroke="#2b3a55" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="110" y="116" width="20" height="14" rx="3" fill="#9aa5ad" stroke="#2b3a55" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="150" y="150" width="30" height="40" rx="6" fill="#ffffff" stroke="#2b3a55" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="158" y="166" width="14" height="18" rx="3" fill="#b0bec5" stroke="#2b3a55" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="160" cy="142" r="10" fill="#f6c9a0" stroke="#2b3a55" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
